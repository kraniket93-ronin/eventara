<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting… - Eventara</title>
  <meta name="description" content="This supplier profile has moved to Eventara's new dynamic Supplier Detail Page." />
  <meta name="robots" content="noindex" />
  <!-- EVENTARA-SEO -->
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.eventara.co.in/provider.html">
  <!-- /EVENTARA-SEO -->

  <link rel="stylesheet" href="styles.css?v=22" />
  <script>
    // provider.html is retired - it was a single hard-coded profile page
    // (Paandora Grand Udaipur only). Every supplier now has its own real
    // page at supplier.html?slug=... . This redirect keeps old bookmarks
    // and external links landing somewhere correct instead of a dead,
    // stale page. location.replace() so the stub never enters browser
    // history (back button skips straight past it).
    window.location.replace('supplier.html?slug=paandora-grand-udaipur');
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=supplier.html?slug=paandora-grand-udaipur">
  </noscript>
</head>
<body>
  <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: var(--space-24);">
    <p style="color: var(--ink-muted); margin-bottom: var(--space-16);">Taking you to this supplier's profile…</p>
    <a href="supplier.html?slug=paandora-grand-udaipur" class="btn btn-primary">Continue to Paandora Grand Udaipur</a>
  </div>
</body>
</html>
